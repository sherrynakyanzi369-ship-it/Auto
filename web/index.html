<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AutoAssist — AI-enabled roadside assistance and automotive services">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0D3B66">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoAssist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AutoAssist — Roadside Assistance</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect for fast image loading -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <!-- Preload hero image for instant splash feel -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=400&q=50">

  <style>
    body { margin: 0; background: #0D3B66; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #000000 0%, #0D3B66 50%, #092A49 100%);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #FFB020;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .brand {
      position: absolute; bottom: 32%; color: rgba(255,255,255,0.9);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px; font-weight: 800; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand">AutoAssist</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
