<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AutoAssist — AI-enabled roadside assistance and automotive services">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D3B66">

  <!-- PWA / iOS install support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoAssist">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AutoAssist — Roadside Assistance</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect for fast image loading -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <!-- Preload hero image for instant splash feel -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=400&q=50">

  <style>
    body { margin: 0; background: #0D3B66; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #000000 0%, #0D3B66 50%, #092A49 100%);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #FFB020;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .brand {
      position: absolute; bottom: 32%; color: rgba(255,255,255,0.9);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px; font-weight: 800; letter-spacing: 1px;
    }

    /* Install / download banner */
    #installCard {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      z-index: 99999; display: none;
      background: rgba(9, 22, 40, 0.96);
      color: #fff;
      border: 1px solid rgba(255, 176, 32, 0.35);
      border-radius: 18px;
      padding: 16px 16px 16px 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: slideUp 0.35s ease;
    }
    #installCard.show { display: block; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    #installCard .row { display: flex; align-items: center; gap: 14px; }
    #installCard .icon {
      width: 52px; height: 52px; border-radius: 14px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    #installCard .icon img { width: 46px; height: 46px; border-radius: 12px; }
    #installCard .copy { flex: 1; min-width: 0; }
    #installCard .title { font-size: 15px; font-weight: 800; letter-spacing: 0.2px; }
    #installCard .sub { font-size: 12.5px; color: rgba(255,255,255,0.66); margin-top: 2px; line-height: 1.4; }
    #installCard .btn {
      flex: 0 0 auto;
      background: linear-gradient(135deg, #FFB020, #FB8C2C);
      color: #0F172A; font-weight: 800; font-size: 14px;
      border: none; border-radius: 12px; padding: 11px 18px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 176, 32, 0.35);
    }
    #installCard .btn:active { transform: scale(0.96); }
    #installCard .close {
      position: absolute; top: 6px; right: 10px;
      background: none; border: none; color: rgba(255,255,255,0.5);
      font-size: 20px; cursor: pointer; line-height: 1; padding: 4px;
    }
    #installCard .steps { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.12); }
    #installCard .steps.show { display: block; }
    #installCard .step { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: rgba(255,255,255,0.8); padding: 4px 0; line-height: 1.4; }
    #installCard .step b { color: #FFB020; }
    #installCard .num {
      width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto;
      background: rgba(255, 176, 32, 0.18); color: #FFB020;
      font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    @media (min-width: 720px) {
      #installCard { left: auto; right: 24px; bottom: 24px; width: 380px; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="brand">AutoAssist</div>
  </div>

  <!-- PWA install / download banner -->
  <div id="installCard">
    <button class="close" onclick="hideInstallCard(true)" aria-label="Close">&times;</button>
    <div class="row">
      <div class="icon"><img src="icons/apple-touch-icon.png" alt="AutoAssist"></div>
      <div class="copy">
        <div class="title">Install AutoAssist</div>
        <div class="sub" id="installSub">Get instant access from your home screen, even offline.</div>
      </div>
      <button class="btn" id="installBtn" onclick="startInstall()">Install</button>
    </div>
    <div class="steps" id="iosSteps">
      <div class="step"><span class="num">1</span><span>Tap the <b>Share</b> button <b>(￼)</b> in Safari&rsquo;s toolbar.</span></div>
      <div class="step"><span class="num">2</span><span>Scroll and choose <b>Add to Home Screen</b>.</span></div>
      <div class="step"><span class="num">3</span><span>Tap <b>Add</b> to confirm. AutoAssist now appears on your Home Screen.</span></div>
    </div>
  </div>

  <script>
    var deferredPrompt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

    function showInstallCard() {
      if (isStandalone) return;
      if (sessionStorage.getItem('autoassist_install_dismissed')) return;
      document.getElementById('installSub').innerHTML = isIos
        ? 'Add AutoAssist to your Home Screen for one-tap access.'
        : 'Get instant access from your home screen, even offline.';
      document.getElementById('installBtn').textContent = isIos ? 'How to Install' : 'Install';
      document.getElementById('installCard').classList.add('show');
    }
    function hideInstallCard(remember) {
      document.getElementById('installCard').classList.remove('show');
      document.getElementById('iosSteps').classList.remove('show');
      if (remember) { try { sessionStorage.setItem('autoassist_install_dismissed', '1'); } catch (e) {} }
    }
    function startInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          hideInstallCard(false);
        });
      } else if (isIos) {
        document.getElementById('iosSteps').classList.toggle('show');
        var sub = document.getElementById('installSub');
        sub.innerHTML = 'On iPhone or iPad, browsers only install apps through the <b>Share</b> menu. Follow the steps below.';
      } else {
        window.location.hash = '';
      }
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      showInstallCard();
    });
    window.addEventListener('appinstalled', function () {
      deferredPrompt = null;
      hideInstallCard(false);
    });

    window.addEventListener('load', function () {
      if (!isStandalone && isIos) {
        setTimeout(function () {
          if (!sessionStorage.getItem('autoassist_install_dismissed')) showInstallCard();
        }, 3000);
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
